name: Brokerage Forex Kubernetes Auto Deploy

on:
  workflow_run:
    workflows:
      - "Brokerage Forex Build and Push"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:

  deploy:

    name: Deploy to Kubernetes

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to Kubernetes Server
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m

          script: |

            set -e

            echo "Brokerage Forex Kubernetes Deployment"

            whoami
            hostname

            cd /home/ubuntu/Applications/Brokerage_forex

            echo "Pulling latest source"

            git pull origin main

            echo "Updating Backend Image"

            kubectl set image deployment/brokerage-forex-backend \
              backend=ghcr.io/suriyanandhimalai555-prog/brokerage-forex-backend:${{ github.event.workflow_run.head_sha }} \
              -n brokerage-forex

            echo "Updating Frontend Image"

            kubectl set image deployment/brokerage-forex-frontend \
              frontend=ghcr.io/suriyanandhimalai555-prog/brokerage-forex-frontend:${{ github.event.workflow_run.head_sha }} \
              -n brokerage-forex

            echo "Waiting for Backend Rollout"

            kubectl rollout status deployment/brokerage-forex-backend \
              -n brokerage-forex \
              --timeout=300s

            echo "Waiting for Frontend Rollout"

            kubectl rollout status deployment/brokerage-forex-frontend \
              -n brokerage-forex \
              --timeout=300s

            echo "Kubernetes Status"

            kubectl get deployments -n brokerage-forex

            echo "Pods"

            kubectl get pods -n brokerage-forex

            echo "HPA"

            kubectl get hpa -n brokerage-forex

            echo "Ingress"

            kubectl get ingress -n brokerage-forex

            echo "Deployment Completed Successfully"


  success-email:

    name: Send Success Email

    needs: deploy

    if: ${{ success() }}

    runs-on: ubuntu-latest

    steps:

      - name: Send Success Email
        uses: dawidd6/action-send-mail@v3

        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "Brokerage Forex Kubernetes Deployment Successful"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          from: ${{ secrets.SMTP_USERNAME }}

          html_body: |
            <h2>Brokerage Forex Kubernetes Deployment Successful</h2>

            <p>
              <b>Repository:</b>
              ${{ github.event.workflow_run.repository.full_name }}
            </p>

            <p>
              <b>Branch:</b>
              main
            </p>

            <p>
              <b>Commit:</b>
              ${{ github.event.workflow_run.head_sha }}
            </p>

            <p>
              <b>Developer:</b>
              ${{ github.event.workflow_run.actor.login }}
            </p>

            <p>
              <b>Status:</b>
              Deployment Successful
            </p>

            <p>
              Brokerage Forex has been successfully deployed to Kubernetes.
            </p>

            <h3>HPA Configuration</h3>

            <ul>
              <li>Backend minimum replicas: 1</li>
              <li>Backend maximum replicas: 10</li>
              <li>Frontend minimum replicas: 1</li>
              <li>Frontend maximum replicas: 10</li>
            </ul>


  failure-email:

    name: Send Failure Email

    needs: deploy

    if: ${{ failure() }}

    runs-on: ubuntu-latest

    steps:

      - name: Send Failure Email
        uses: dawidd6/action-send-mail@v3

        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "Brokerage Forex Kubernetes Deployment Failed"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          from: ${{ secrets.SMTP_USERNAME }}

          html_body: |
            <h2>Brokerage Forex Kubernetes Deployment Failed</h2>

            <p>
              <b>Repository:</b>
              ${{ github.event.workflow_run.repository.full_name }}
            </p>

            <p>
              <b>Branch:</b>
              main
            </p>

            <p>
              <b>Commit:</b>
              ${{ github.event.workflow_run.head_sha }}
            </p>

            <p>
              <b>Developer:</b>
              ${{ github.event.workflow_run.actor.login }}
            </p>

            <p>
              Please check the GitHub Actions logs for the deployment error.
            </p>
