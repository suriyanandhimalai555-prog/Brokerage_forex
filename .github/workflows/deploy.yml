name: Brokerage Forex Kubernetes Auto Deploy

on:
  workflow_run:
    workflows:
      - "Brokerage Forex Build and Push"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:

  deploy:

    name: Deploy to Kubernetes

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to Kubernetes Server
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m

          script: |

            set -e

            NAMESPACE="brokerage-forex"

            BACKEND_DEPLOYMENT="brokerage-forex-backend"
            FRONTEND_DEPLOYMENT="brokerage-forex-frontend"

            BACKEND_CONTAINER="backend"
            FRONTEND_CONTAINER="frontend"

            BACKEND_IMAGE="ghcr.io/suriyanandhimalai555-prog/brokerage-forex-backend:${{ github.event.workflow_run.head_sha }}"
            FRONTEND_IMAGE="ghcr.io/suriyanandhimalai555-prog/brokerage-forex-frontend:${{ github.event.workflow_run.head_sha }}"

            echo "=========================================="
            echo "Brokerage Forex Kubernetes Deployment"
            echo "=========================================="

            echo "Server:"
            whoami
            hostname

            echo ""
            echo "Commit:"
            echo "${{ github.event.workflow_run.head_sha }}"

            echo ""
            echo "Backend Image:"
            echo "$BACKEND_IMAGE"

            echo ""
            echo "Frontend Image:"
            echo "$FRONTEND_IMAGE"


            echo "=========================================="
            echo "Checking Kubernetes Cluster"
            echo "=========================================="

            kubectl get nodes

            kubectl get namespace "$NAMESPACE"


            echo "=========================================="
            echo "Current Deployment State"
            echo "=========================================="

            kubectl get deployments -n "$NAMESPACE"

            kubectl get pods -n "$NAMESPACE"


            echo "=========================================="
            echo "Saving Current Revisions"
            echo "=========================================="

            BACKEND_REVISION=$(kubectl get deployment "$BACKEND_DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')

            FRONTEND_REVISION=$(kubectl get deployment "$FRONTEND_DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')

            echo "Backend current revision: $BACKEND_REVISION"
            echo "Frontend current revision: $FRONTEND_REVISION"


            echo "=========================================="
            echo "Deploying Backend"
            echo "=========================================="

            kubectl set image deployment/"$BACKEND_DEPLOYMENT" \
              "$BACKEND_CONTAINER=$BACKEND_IMAGE" \
              -n "$NAMESPACE"

            echo "Backend image updated."


            echo "=========================================="
            echo "Waiting for Backend Rollout"
            echo "=========================================="

            if ! kubectl rollout status deployment/"$BACKEND_DEPLOYMENT" \
              -n "$NAMESPACE" \
              --timeout=300s; then

              echo "=========================================="
              echo "BACKEND ROLLOUT FAILED"
              echo "=========================================="

              echo "Backend rollout status:"
              kubectl rollout status deployment/"$BACKEND_DEPLOYMENT" \
                -n "$NAMESPACE" || true

              echo ""
              echo "Backend pods:"
              kubectl get pods \
                -n "$NAMESPACE" \
                -l app=brokerage-forex-backend \
                -o wide

              echo ""
              echo "Backend ReplicaSets:"
              kubectl get rs \
                -n "$NAMESPACE" \
                -l app=brokerage-forex-backend

              echo ""
              echo "Starting backend rollback..."

              kubectl rollout undo deployment/"$BACKEND_DEPLOYMENT" \
                -n "$NAMESPACE" \
                --to-revision="$BACKEND_REVISION"

              echo "Waiting for backend rollback..."

              kubectl rollout status deployment/"$BACKEND_DEPLOYMENT" \
                -n "$NAMESPACE" \
                --timeout=300s

              echo ""
              echo "Backend rollback completed."

              kubectl get deployment "$BACKEND_DEPLOYMENT" \
                -n "$NAMESPACE"

              kubectl get pods \
                -n "$NAMESPACE" \
                -l app=brokerage-forex-backend

              exit 1

            fi


            echo "=========================================="
            echo "Backend Rollout Successful"
            echo "=========================================="

            kubectl get deployment "$BACKEND_DEPLOYMENT" \
              -n "$NAMESPACE"

            kubectl get pods \
              -n "$NAMESPACE" \
              -l app=brokerage-forex-backend


            echo "=========================================="
            echo "Backend Health Verification"
            echo "=========================================="

            BACKEND_POD=$(kubectl get pods \
              -n "$NAMESPACE" \
              -l app=brokerage-forex-backend \
              -o jsonpath='{.items[0].metadata.name}')

            echo "Testing backend pod:"
            echo "$BACKEND_POD"

            kubectl exec \
              -n "$NAMESPACE" \
              "$BACKEND_POD" \
              -- wget -qO- http://localhost:4030/health

            echo ""
            echo "Backend health check passed."


            echo "=========================================="
            echo "Deploying Frontend"
            echo "=========================================="

            kubectl set image deployment/"$FRONTEND_DEPLOYMENT" \
              "$FRONTEND_CONTAINER=$FRONTEND_IMAGE" \
              -n "$NAMESPACE"

            echo "Frontend image updated."


            echo "=========================================="
            echo "Waiting for Frontend Rollout"
            echo "=========================================="

            if ! kubectl rollout status deployment/"$FRONTEND_DEPLOYMENT" \
              -n "$NAMESPACE" \
              --timeout=300s; then

              echo "=========================================="
              echo "FRONTEND ROLLOUT FAILED"
              echo "=========================================="

              echo "Frontend rollout status:"
              kubectl rollout status deployment/"$FRONTEND_DEPLOYMENT" \
                -n "$NAMESPACE" || true

              echo ""
              echo "Frontend pods:"
              kubectl get pods \
                -n "$NAMESPACE" \
                -l app=brokerage-forex-frontend \
                -o wide

              echo ""
              echo "Starting frontend rollback..."

              kubectl rollout undo deployment/"$FRONTEND_DEPLOYMENT" \
                -n "$NAMESPACE" \
                --to-revision="$FRONTEND_REVISION"

              echo "Waiting for frontend rollback..."

              kubectl rollout status deployment/"$FRONTEND_DEPLOYMENT" \
                -n "$NAMESPACE" \
                --timeout=300s

              echo ""
              echo "Frontend rollback completed."

              kubectl get deployment "$FRONTEND_DEPLOYMENT" \
                -n "$NAMESPACE"

              kubectl get pods \
                -n "$NAMESPACE" \
                -l app=brokerage-forex-frontend

              exit 1

            fi


            echo "=========================================="
            echo "Frontend Rollout Successful"
            echo "=========================================="

            kubectl get deployment "$FRONTEND_DEPLOYMENT" \
              -n "$NAMESPACE"

            kubectl get pods \
              -n "$NAMESPACE" \
              -l app=brokerage-forex-frontend


            echo "=========================================="
            echo "Final Kubernetes Verification"
            echo "=========================================="

            kubectl get deployments \
              -n "$NAMESPACE"

            echo ""

            kubectl get pods \
              -n "$NAMESPACE"

            echo ""

            kubectl get hpa \
              -n "$NAMESPACE"

            echo ""

            kubectl get ingress \
              -n "$NAMESPACE"


            echo "=========================================="
            echo "Final Backend Image"
            echo "=========================================="

            kubectl get deployment "$BACKEND_DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}'

            echo ""


            echo "=========================================="
            echo "Final Frontend Image"
            echo "=========================================="

            kubectl get deployment "$FRONTEND_DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}'

            echo ""


            echo "=========================================="
            echo "Deployment Completed Successfully"
            echo "=========================================="


  notify-email:
    name: Send Microsoft Graph Deployment Notification

    needs: deploy

    if: always()

    runs-on: ubuntu-latest

    env:
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}

      MS_SENDER_EMAIL: ${{ secrets.MS_SENDER_EMAIL || vars.MS_SENDER_EMAIL }}
      MAIL_TO: ${{ secrets.MAIL_TO || vars.MAIL_TO }}
      MAIL_CC: ${{ secrets.MAIL_CC || vars.MAIL_CC }}

      BUILD_RESULT: ${{ github.event.workflow_run.conclusion }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}

      REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      PUSHED_BY: ${{ github.event.workflow_run.actor.login }}
      COMMIT_AUTHOR: ${{ github.event.workflow_run.head_commit.author.name }}
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

      BUILD_RUN_URL: ${{ github.event.workflow_run.html_url }}
      DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      NAMESPACE: brokerage-forex

    steps:

      - name: Send Deployment Notification through Microsoft Graph
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Brokerage Forex Microsoft Graph Notification"
          echo "=========================================="

          echo "Build result: $BUILD_RESULT"
          echo "Deployment result: $DEPLOY_RESULT"

          if [[ "$BUILD_RESULT" == "success" && "$DEPLOY_RESULT" == "success" ]]; then
            FINAL_STATUS="SUCCESS"
            SUBJECT="Brokerage Forex Kubernetes Deployment Successful"
            STATUS_TITLE="Brokerage Forex Deployment SUCCESSFUL"
          else
            FINAL_STATUS="FAILED"
            SUBJECT="FAILED: Brokerage Forex Kubernetes Deployment"
            STATUS_TITLE="Brokerage Forex Deployment FAILED"
          fi

          echo "Final status: $FINAL_STATUS"

          echo
          echo "===== VALIDATE REQUIRED CONFIGURATION ====="

          for variable in MS_TENANT_ID MS_CLIENT_ID MS_CLIENT_SECRET MS_SENDER_EMAIL MAIL_TO; do
            if [[ -z "${!variable:-}" ]]; then
              echo "ERROR: Required configuration missing: $variable"
              exit 1
            fi
          done

          echo "Required configuration is present."

          echo
          echo "===== PREPARE EMAIL RECIPIENTS ====="

          TO_RECIPIENTS=$(jq -cn \
            --arg raw "$MAIL_TO" \
            '$raw
             | gsub(";"; ",")
             | split(",")
             | map(gsub("^\\s+|\\s+$"; ""))
             | map(select(length > 0))
             | map({emailAddress: {address: .}})')

          CC_RECIPIENTS=$(jq -cn \
            --arg raw "${MAIL_CC:-}" \
            '$raw
             | gsub(";"; ",")
             | split(",")
             | map(gsub("^\\s+|\\s+$"; ""))
             | map(select(length > 0))
             | map({emailAddress: {address: .}})')

          if ! jq -e 'length > 0' >/dev/null <<< "$TO_RECIPIENTS"; then
            echo "ERROR: No valid To recipient configured."
            exit 1
          fi

          echo "To recipient configuration validated."
          echo "CC recipient configuration validated."

          echo
          echo "===== REQUEST MICROSOFT GRAPH ACCESS TOKEN ====="

          TOKEN_RESPONSE=$(curl --silent --show-error --fail \
            --request POST \
            "https://login.microsoftonline.com/${MS_TENANT_ID}/oauth2/v2.0/token" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${MS_CLIENT_ID}" \
            --data-urlencode "client_secret=${MS_CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          ACCESS_TOKEN=$(jq -r '.access_token // empty' <<< "$TOKEN_RESPONSE")

          if [[ -z "$ACCESS_TOKEN" ]]; then
            echo "ERROR: Microsoft Graph access token was not returned."
            exit 1
          fi

          unset TOKEN_RESPONSE

          echo "Microsoft Graph authentication successful."

          echo
          echo "===== PREPARE DEPLOYMENT EMAIL ====="

          HTML_BODY=$(cat <<EOF
          <html>
          <body>

          <h2>${STATUS_TITLE}</h2>

          <table border="1" cellpadding="8" cellspacing="0">
            <tr><th align="left">Field</th><th align="left">Value</th></tr>
            <tr><td>Repository</td><td>${REPOSITORY}</td></tr>
            <tr><td>Branch</td><td>${BRANCH}</td></tr>
            <tr><td>Pushed By</td><td>${PUSHED_BY}</td></tr>
            <tr><td>Commit Author</td><td>${COMMIT_AUTHOR:-Unknown}</td></tr>
            <tr><td>Image Tag / Commit</td><td>${COMMIT_SHA}</td></tr>
            <tr><td>Docker Build Result</td><td>${BUILD_RESULT}</td></tr>
            <tr><td>Deployment Job Result</td><td>${DEPLOY_RESULT}</td></tr>
            <tr><td>Namespace</td><td>${NAMESPACE}</td></tr>
          </table>

          <h3>Email Links</h3>

          <p>
            <a href="${BUILD_RUN_URL}">View Docker Build Run</a>
          </p>

          <p>
            <a href="${DEPLOY_RUN_URL}">View Deployment Workflow Run</a>
          </p>

          <h2>${STATUS_TITLE}</h2>

          </body>
          </html>
          EOF
          )

          EMAIL_PAYLOAD=$(jq -cn \
            --arg subject "$SUBJECT" \
            --arg html "$HTML_BODY" \
            --argjson to "$TO_RECIPIENTS" \
            --argjson cc "$CC_RECIPIENTS" \
            '{
              message: {
                subject: $subject,
                body: {
                  contentType: "HTML",
                  content: $html
                },
                toRecipients: $to,
                ccRecipients: $cc
              },
              saveToSentItems: true
            }')

          echo "Email content prepared."

          echo
          echo "===== SEND EMAIL THROUGH MICROSOFT GRAPH ====="

          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          HTTP_STATUS=$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --request POST \
            "https://graph.microsoft.com/v1.0/users/${MS_SENDER_EMAIL}/sendMail" \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$EMAIL_PAYLOAD")

          unset ACCESS_TOKEN EMAIL_PAYLOAD HTML_BODY

          if [[ "$HTTP_STATUS" != "202" ]]; then
            echo "ERROR: Microsoft Graph email request failed."
            echo "HTTP status: $HTTP_STATUS"
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "=========================================="
          echo "Microsoft Graph accepted the email."
          echo "Notification status: $FINAL_STATUS"
          echo "=========================================="
