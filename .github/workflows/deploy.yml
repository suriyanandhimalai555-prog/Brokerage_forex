name: Brokerage Forex Kubernetes Auto Deploy

on:
  workflow_run:
    workflows:
      - "Brokerage Forex Build and Push"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:

  deploy:

    name: Deploy to Kubernetes

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to Kubernetes Server
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m

          script: |

            set -e

            NAMESPACE="brokerage-forex"

            BACKEND_DEPLOYMENT="brokerage-forex-backend"
            FRONTEND_DEPLOYMENT="brokerage-forex-frontend"

            BACKEND_CONTAINER="backend"
            FRONTEND_CONTAINER="frontend"

            BACKEND_IMAGE="ghcr.io/suriyanandhimalai555-prog/brokerage-forex-backend:${{ github.event.workflow_run.head_sha }}"
            FRONTEND_IMAGE="ghcr.io/suriyanandhimalai555-prog/brokerage-forex-frontend:${{ github.event.workflow_run.head_sha }}"

            echo "=========================================="
            echo "Brokerage Forex Kubernetes Deployment"
            echo "=========================================="

            echo "Server:"
            whoami
            hostname

            echo ""
            echo "Commit:"
            echo "${{ github.event.workflow_run.head_sha }}"

            echo ""
            echo "Backend Image:"
            echo "$BACKEND_IMAGE"

            echo ""
            echo "Frontend Image:"
            echo "$FRONTEND_IMAGE"


            echo "=========================================="
            echo "Checking Kubernetes Cluster"
            echo "=========================================="

            kubectl get nodes

            kubectl get namespace "$NAMESPACE"


            echo "=========================================="
            echo "Current Deployment State"
            echo "=========================================="

            kubectl get deployments -n "$NAMESPACE"

            kubectl get pods -n "$NAMESPACE"


            echo "=========================================="
            echo "Saving Current Revisions"
            echo "=========================================="

            BACKEND_REVISION=$(kubectl get deployment "$BACKEND_DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')

            FRONTEND_REVISION=$(kubectl get deployment "$FRONTEND_DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')

            echo "Backend current revision: $BACKEND_REVISION"
            echo "Frontend current revision: $FRONTEND_REVISION"


            echo "=========================================="
            echo "Deploying Backend"
            echo "=========================================="

            kubectl set image deployment/"$BACKEND_DEPLOYMENT" \
              "$BACKEND_CONTAINER=$BACKEND_IMAGE" \
              -n "$NAMESPACE"

            echo "Backend image updated."


            echo "=========================================="
            echo "Waiting for Backend Rollout"
            echo "=========================================="

            if ! kubectl rollout status deployment/"$BACKEND_DEPLOYMENT" \
              -n "$NAMESPACE" \
              --timeout=300s; then

              echo "=========================================="
              echo "BACKEND ROLLOUT FAILED"
              echo "=========================================="

              echo "Backend rollout status:"
              kubectl rollout status deployment/"$BACKEND_DEPLOYMENT" \
                -n "$NAMESPACE" || true

              echo ""
              echo "Backend pods:"
              kubectl get pods \
                -n "$NAMESPACE" \
                -l app=brokerage-forex-backend \
                -o wide

              echo ""
              echo "Backend ReplicaSets:"
              kubectl get rs \
                -n "$NAMESPACE" \
                -l app=brokerage-forex-backend

              echo ""
              echo "Starting backend rollback..."

              kubectl rollout undo deployment/"$BACKEND_DEPLOYMENT" \
                -n "$NAMESPACE" \
                --to-revision="$BACKEND_REVISION"

              echo "Waiting for backend rollback..."

              kubectl rollout status deployment/"$BACKEND_DEPLOYMENT" \
                -n "$NAMESPACE" \
                --timeout=300s

              echo ""
              echo "Backend rollback completed."

              kubectl get deployment "$BACKEND_DEPLOYMENT" \
                -n "$NAMESPACE"

              kubectl get pods \
                -n "$NAMESPACE" \
                -l app=brokerage-forex-backend

              exit 1

            fi


            echo "=========================================="
            echo "Backend Rollout Successful"
            echo "=========================================="

            kubectl get deployment "$BACKEND_DEPLOYMENT" \
              -n "$NAMESPACE"

            kubectl get pods \
              -n "$NAMESPACE" \
              -l app=brokerage-forex-backend


            echo "=========================================="
            echo "Backend Health Verification"
            echo "=========================================="

            BACKEND_POD=$(kubectl get pods \
              -n "$NAMESPACE" \
              -l app=brokerage-forex-backend \
              -o jsonpath='{.items[0].metadata.name}')

            echo "Testing backend pod:"
            echo "$BACKEND_POD"

            kubectl exec \
              -n "$NAMESPACE" \
              "$BACKEND_POD" \
              -- wget -qO- http://localhost:4030/health

            echo ""
            echo "Backend health check passed."


            echo "=========================================="
            echo "Deploying Frontend"
            echo "=========================================="

            kubectl set image deployment/"$FRONTEND_DEPLOYMENT" \
              "$FRONTEND_CONTAINER=$FRONTEND_IMAGE" \
              -n "$NAMESPACE"

            echo "Frontend image updated."


            echo "=========================================="
            echo "Waiting for Frontend Rollout"
            echo "=========================================="

            if ! kubectl rollout status deployment/"$FRONTEND_DEPLOYMENT" \
              -n "$NAMESPACE" \
              --timeout=300s; then

              echo "=========================================="
              echo "FRONTEND ROLLOUT FAILED"
              echo "=========================================="

              echo "Frontend rollout status:"
              kubectl rollout status deployment/"$FRONTEND_DEPLOYMENT" \
                -n "$NAMESPACE" || true

              echo ""
              echo "Frontend pods:"
              kubectl get pods \
                -n "$NAMESPACE" \
                -l app=brokerage-forex-frontend \
                -o wide

              echo ""
              echo "Starting frontend rollback..."

              kubectl rollout undo deployment/"$FRONTEND_DEPLOYMENT" \
                -n "$NAMESPACE" \
                --to-revision="$FRONTEND_REVISION"

              echo "Waiting for frontend rollback..."

              kubectl rollout status deployment/"$FRONTEND_DEPLOYMENT" \
                -n "$NAMESPACE" \
                --timeout=300s

              echo ""
              echo "Frontend rollback completed."

              kubectl get deployment "$FRONTEND_DEPLOYMENT" \
                -n "$NAMESPACE"

              kubectl get pods \
                -n "$NAMESPACE" \
                -l app=brokerage-forex-frontend

              exit 1

            fi


            echo "=========================================="
            echo "Frontend Rollout Successful"
            echo "=========================================="

            kubectl get deployment "$FRONTEND_DEPLOYMENT" \
              -n "$NAMESPACE"

            kubectl get pods \
              -n "$NAMESPACE" \
              -l app=brokerage-forex-frontend


            echo "=========================================="
            echo "Final Kubernetes Verification"
            echo "=========================================="

            kubectl get deployments \
              -n "$NAMESPACE"

            echo ""

            kubectl get pods \
              -n "$NAMESPACE"

            echo ""

            kubectl get hpa \
              -n "$NAMESPACE"

            echo ""

            kubectl get ingress \
              -n "$NAMESPACE"


            echo "=========================================="
            echo "Final Backend Image"
            echo "=========================================="

            kubectl get deployment "$BACKEND_DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}'

            echo ""


            echo "=========================================="
            echo "Final Frontend Image"
            echo "=========================================="

            kubectl get deployment "$FRONTEND_DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}'

            echo ""


            echo "=========================================="
            echo "Deployment Completed Successfully"
            echo "=========================================="


  success-email:

    name: Send Success Email

    needs: deploy

    if: ${{ success() }}

    runs-on: ubuntu-latest

    steps:

      - name: Send Success Email
        uses: dawidd6/action-send-mail@v3

        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "Brokerage Forex Kubernetes Deployment Successful"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            devops@avgprimetech.com

          from: ${{ secrets.SMTP_USERNAME }}

          html_body: |
            <h2>Brokerage Forex Kubernetes Deployment Successful</h2>

            <p>
              <b>Repository:</b>
              ${{ github.event.workflow_run.repository.full_name }}
            </p>

            <p>
              <b>Branch:</b>
              main
            </p>

            <p>
              <b>Commit:</b>
              ${{ github.event.workflow_run.head_sha }}
            </p>

            <p>
              <b>Developer:</b>
              ${{ github.event.workflow_run.actor.login }}
            </p>

            <p>
              <b>Status:</b>
              Deployment Successful
            </p>

            <p>
              Brokerage Forex has been successfully deployed to Kubernetes.
            </p>

            <h3>Deployment Strategy</h3>

            <ul>
              <li>Rolling Update</li>
              <li>Zero-downtime deployment</li>
              <li>Readiness probe verification</li>
              <li>Backend health verification</li>
              <li>Automatic rollback on rollout failure</li>
              <li>SHA-based Docker images</li>
            </ul>

            <h3>HPA Configuration</h3>

            <ul>
              <li>Backend minimum replicas: 1</li>
              <li>Backend maximum replicas: 10</li>
              <li>Frontend minimum replicas: 1</li>
              <li>Frontend maximum replicas: 10</li>
            </ul>


  failure-email:

    name: Send Failure Email

    needs: deploy

    if: ${{ failure() }}

    runs-on: ubuntu-latest

    steps:

      - name: Send Failure Email
        uses: dawidd6/action-send-mail@v3

        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "Brokerage Forex Kubernetes Deployment Failed - Rollback Attempted"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            devops@avgprimetech.com

          from: ${{ secrets.SMTP_USERNAME }}

          html_body: |
            <h2>Brokerage Forex Kubernetes Deployment Failed</h2>

            <p>
              <b>Repository:</b>
              ${{ github.event.workflow_run.repository.full_name }}
            </p>

            <p>
              <b>Branch:</b>
              main
            </p>

            <p>
              <b>Commit:</b>
              ${{ github.event.workflow_run.head_sha }}
            </p>

            <p>
              <b>Developer:</b>
              ${{ github.event.workflow_run.actor.login }}
            </p>

            <p>
              <b>Status:</b>
              Deployment failed.
            </p>

            <p>
              Kubernetes automatic rollback was attempted.
            </p>

            <p>
              The previous healthy Kubernetes revision was restored.
            </p>

            <p>
              Please check the GitHub Actions logs for complete deployment
              and rollback details.
            </p>
