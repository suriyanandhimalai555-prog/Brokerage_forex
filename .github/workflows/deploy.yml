name: Brokerage Forex Kubernetes Auto Deploy

on:
  workflow_run:
    workflows:
      - "Brokerage Forex Build and Push"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:

  deploy:

    name: Deploy to Kubernetes

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to Kubernetes Server
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m

          script: |

            set -e

            echo "=========================================="
            echo "Brokerage Forex Kubernetes Deployment"
            echo "=========================================="

            whoami
            hostname

            cd /home/ubuntu/Applications/Brokerage_forex

            echo "Pulling latest source"

            git pull origin main


            echo "=========================================="
            echo "Updating Backend Image"
            echo "=========================================="

            kubectl set image deployment/brokerage-forex-backend \
              backend=ghcr.io/suriyanandhimalai555-prog/brokerage-forex-backend:${{ github.event.workflow_run.head_sha }} \
              -n brokerage-forex


            echo "Waiting for Backend Rollout"

            if ! kubectl rollout status deployment/brokerage-forex-backend \
              -n brokerage-forex \
              --timeout=300s; then

              echo "=========================================="
              echo "BACKEND DEPLOYMENT FAILED"
              echo "Starting Backend Rollback"
              echo "=========================================="

              kubectl rollout undo deployment/brokerage-forex-backend \
                -n brokerage-forex

              echo "Waiting for Backend Rollback"

              kubectl rollout status deployment/brokerage-forex-backend \
                -n brokerage-forex \
                --timeout=300s

              echo "=========================================="
              echo "Backend Rollback Completed Successfully"
              echo "=========================================="

              exit 1

            fi


            echo "=========================================="
            echo "Backend Deployment Successful"
            echo "=========================================="


            echo "=========================================="
            echo "Updating Frontend Image"
            echo "=========================================="

            kubectl set image deployment/brokerage-forex-frontend \
              frontend=ghcr.io/suriyanandhimalai555-prog/brokerage-forex-frontend:${{ github.event.workflow_run.head_sha }} \
              -n brokerage-forex


            echo "Waiting for Frontend Rollout"

            if ! kubectl rollout status deployment/brokerage-forex-frontend \
              -n brokerage-forex \
              --timeout=300s; then

              echo "=========================================="
              echo "FRONTEND DEPLOYMENT FAILED"
              echo "Starting Frontend Rollback"
              echo "=========================================="

              kubectl rollout undo deployment/brokerage-forex-frontend \
                -n brokerage-forex

              echo "Waiting for Frontend Rollback"

              kubectl rollout status deployment/brokerage-forex-frontend \
                -n brokerage-forex \
                --timeout=300s

              echo "=========================================="
              echo "Frontend Rollback Completed Successfully"
              echo "=========================================="

              exit 1

            fi


            echo "=========================================="
            echo "Frontend Deployment Successful"
            echo "=========================================="


            echo "=========================================="
            echo "Kubernetes Status"
            echo "=========================================="

            kubectl get deployments -n brokerage-forex


            echo "=========================================="
            echo "Pods"
            echo "=========================================="

            kubectl get pods -n brokerage-forex


            echo "=========================================="
            echo "HPA"
            echo "=========================================="

            kubectl get hpa -n brokerage-forex


            echo "=========================================="
            echo "Ingress"
            echo "=========================================="

            kubectl get ingress -n brokerage-forex


            echo "=========================================="
            echo "Deployment Completed Successfully"
            echo "=========================================="


  success-email:

    name: Send Success Email

    needs: deploy

    if: ${{ success() }}

    runs-on: ubuntu-latest

    steps:

      - name: Send Success Email
        uses: dawidd6/action-send-mail@v3

        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "Brokerage Forex Kubernetes Deployment Successful"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            devops@avgprimetech.com

          from: ${{ secrets.SMTP_USERNAME }}

          html_body: |
            <h2>Brokerage Forex Kubernetes Deployment Successful</h2>

            <p>
              <b>Repository:</b>
              ${{ github.event.workflow_run.repository.full_name }}
            </p>

            <p>
              <b>Branch:</b>
              main
            </p>

            <p>
              <b>Commit:</b>
              ${{ github.event.workflow_run.head_sha }}
            </p>

            <p>
              <b>Developer:</b>
              ${{ github.event.workflow_run.actor.login }}
            </p>

            <p>
              <b>Status:</b>
              Deployment Successful
            </p>

            <p>
              Brokerage Forex has been successfully deployed to Kubernetes.
            </p>

            <h3>HPA Configuration</h3>

            <ul>
              <li>Backend minimum replicas: 1</li>
              <li>Backend maximum replicas: 10</li>
              <li>Frontend minimum replicas: 1</li>
              <li>Frontend maximum replicas: 10</li>
            </ul>


  failure-email:

    name: Send Failure Email

    needs: deploy

    if: ${{ failure() }}

    runs-on: ubuntu-latest

    steps:

      - name: Send Failure Email
        uses: dawidd6/action-send-mail@v3

        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "Brokerage Forex Kubernetes Deployment Failed - Rollback Attempted"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            devops@avgprimetech.com

          from: ${{ secrets.SMTP_USERNAME }}

          html_body: |
            <h2>Brokerage Forex Kubernetes Deployment Failed</h2>

            <p>
              <b>Repository:</b>
              ${{ github.event.workflow_run.repository.full_name }}
            </p>

            <p>
              <b>Branch:</b>
              main
            </p>

            <p>
              <b>Commit:</b>
              ${{ github.event.workflow_run.head_sha }}
            </p>

            <p>
              <b>Developer:</b>
              ${{ github.event.workflow_run.actor.login }}
            </p>

            <p>
              <b>Status:</b>
              New deployment failed.
            </p>

            <p>
              Kubernetes automatic rollback was attempted.
            </p>

            <p>
              Please check the GitHub Actions logs for complete deployment
              and rollback details.
            </p>
