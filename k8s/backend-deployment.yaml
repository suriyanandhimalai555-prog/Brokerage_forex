apiVersion: apps/v1
kind: Deployment
metadata:
  name: brokerage-forex-backend
  namespace: brokerage-forex
  labels:
    app: brokerage-forex-backend

spec:
  replicas: 1

  revisionHistoryLimit: 10

  progressDeadlineSeconds: 600

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: brokerage-forex-backend

  template:
    metadata:
      labels:
        app: brokerage-forex-backend

    spec:
      terminationGracePeriodSeconds: 30

      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: backend

          image: ghcr.io/suriyanandhimalai555-prog/brokerage-forex-backend:latest

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 4030
              protocol: TCP

          envFrom:
            - secretRef:
                name: brokerage-forex-backend-secret

          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP

            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP

            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi
